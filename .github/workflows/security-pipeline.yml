name: Security CI Pipeline
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit semgrep pip-audit
          
      - name: Create reports directory
        run: mkdir -p reports
        
      - name: Run tests
        run: pytest -v
        
      - name: Run Bandit (SAST)
        run: bandit -r app/ -f json -o reports/bandit-report.json || true
        
      - name: Run Semgrep (SAST)
        run: |
          semgrep scan --config security/semgrep/rules.yml --json --output reports/semgrep-report.json app/ || true
        
      - name: Run pip-audit (Dependency Scan)
        run: pip-audit -f json -o reports/dependency-report.json || true
        
      - name: Build Docker Image
        run: docker build -t vulnfinbot:latest .
        
      - name: Run Trivy (Container Scan)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'vulnfinbot:latest'
          format: 'json'
          output: 'reports/trivy-report.json'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
        
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          retention-days: 30